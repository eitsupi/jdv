name: Test server

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/server-test.yaml
      - server/**
      - deno.json
      - deno.lock
      - mise.toml
      - "!**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/server-test.yaml
      - server/**
      - deno.json
      - deno.lock
      - mise.toml
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Deno unit tests (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENABLE_TOOLS: deno
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
      - name: Check Deno formatting
        run: deno task fmt
      - name: Lint Deno sources
        run: deno task lint
      - name: Check server entry point
        run: deno task check
      - name: Run Deno unit tests
        run: deno task test:unit
